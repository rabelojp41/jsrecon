[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsrecon"
version = "0.1.0"
description = "Recon de aplicações web focado em JavaScript, CDN/WAF e origem — para pentests autorizados e bug bounty."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "dnspython>=2.6",
    "beautifulsoup4>=4.12",
    "mmh3>=4.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
jsrecon = "jsrecon.cli:main"

[tool.setuptools.packages.find]
include = ["jsrecon*"]

[tool.setuptools.package-data]
jsrecon = ["report/templates/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
